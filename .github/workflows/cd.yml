name: DACN-Dealershipstore-Frontend-CD

on:
  push:
    branches:
      - "main"

env:
  IMAGE_NAME: dacn-dealershipstore-frontend

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.extract-version.outputs.version }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Extract Version
        id: extract-version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's#Dev/##')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Environment File
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
          echo "VITE_AI_URL=${{ secrets.VITE_AI_URL }}" >> .env

      - name: Show Version
        run: |
          echo "Version: ${{ steps.extract-version.outputs.version }}"

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg ENV=development \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.extract-version.outputs.version }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.extract-version.outputs.version }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy To VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            set VERSION "${{ needs.build-and-push.outputs.version }}"

            echo "Pulling image version: $VERSION"

            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:$VERSION

            echo "Stopping old container..."
            docker stop ${{ env .IMAGE_NAME }} || true
            docker rm ${{ env .IMAGE_NAME }} || true

            echo "Cleaning old port..."
            sudo lsof -t -i:5173 | xargs -r kill -9 || true

            echo "Starting new container..."

            docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              -e PORT=5173 \
              -p 5173:5173 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:$VERSION

            echo "✅ Deployment completed"

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup Docker Resources
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            echo "Cleaning unused Docker resources..."

            docker image prune -f
            docker container prune -f
            docker builder prune -f

            echo "✅ Cleanup completed"